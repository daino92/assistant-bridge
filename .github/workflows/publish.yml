name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Check whether this version is already published
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) });

          if (!response.ok && response.status !== 404) {
            throw new Error(`Registry lookup failed: HTTP ${response.status}`);
          }

          const published = response.ok;

          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          console.log(`${name}@${version}: ${published ? 'already published; skipping' : 'ready to publish'}`);
          NODE
      - name: Install locked dependencies
        if: steps.version.outputs.published == 'false'
        run: pnpm install --frozen-lockfile
      - name: Validate
        if: steps.version.outputs.published == 'false'
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build and verify package
        if: steps.version.outputs.published == 'false'
        run: |
          pnpm package:check
          pnpm schemas:check
          git diff --exit-code -- schemas
      - name: Publish using trusted publishing
        if: steps.version.outputs.published == 'false'
        run: pnpm dlx npm@11 publish --access public --provenance
